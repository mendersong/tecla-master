name: Android APK — TECLADO MASTER
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

jobs:
  test-and-debug:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: teclado-master-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    runs-on: ubuntu-latest
    needs: test-and-debug
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Verify signing secrets
        env: { KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", STORE_PASSWORD: "${{ secrets.ANDROID_STORE_PASSWORD }}", KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}", KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}" }
        run: 'test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Configure os quatro secrets de assinatura Android"; exit 1; }'
      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}", STORE_PASSWORD: "${{ secrets.ANDROID_STORE_PASSWORD }}", KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}", KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}" }
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          gradle wrapper --gradle-version 8.9 && chmod +x gradlew
      - name: Build and verify signed release
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teclado-master-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
